apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-test-app
  namespace: ci-test
spec:
  replicas: 2

  selector:
    matchLabels:
      app: ci-test-app

  template:
    metadata:
      labels:
        app: ci-test-app

    spec:
      containers:
        - name: ci-test-app
          image: szabokasz/ci-test-app:latest

          ports:
            - containerPort: 80

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
