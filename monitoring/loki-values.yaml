---
# Grafana Loki Helm chart: 7.3.0

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1

  nodeSelector:
    kubernetes.io/hostname: worker2

  persistence:
    enabled: true
    storageClass: loki-local
    accessModes:
      - ReadWriteOnce
    size: 30Gi
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain

# Disable scalable deployment components
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Internal access only
gateway:
  enabled: true

  nginxConfig:
    resolver: "10.233.0.3"

  service:
    type: ClusterIP

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

lokiCanary:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false

test:
  enabled: false
