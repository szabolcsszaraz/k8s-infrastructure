---
# kube-prometheus-stack chart: 91.8.1

# Prometheus Operator
prometheusOperator:
  affinity: &workerOnly
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

# Prometheus
prometheus:
  ingress:
    enabled: false

  prometheusSpec:
    replicas: 1

    retention: 15d
    retentionSize: 25GB

    affinity: *workerOnly

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: prometheus-local
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi

# Grafana
grafana:
  enabled: true

  adminPassword: ""

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: false

  service:
    type: ClusterIP

  affinity: *workerOnly

  persistence:
    enabled: false

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: false
      jsonData:
        maxLines: 1000

# Alertmanager
alertmanager:
  enabled: true

  ingress:
    enabled: false

  alertmanagerSpec:
    replicas: 1
    affinity: *workerOnly

# Kubernetes resource metrics
kube-state-metrics:
  affinity: *workerOnly

# Node metrics, including the master
nodeExporter:
  enabled: true

prometheus-node-exporter:
  tolerations:
    - operator: Exists
